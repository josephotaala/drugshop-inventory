<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trusteen Drug Center | Smart Inventory</title>
<style>
:root{--navy:#17324d;--blue:#245b83;--teal:#168579;--bg:#f4f7fa;--line:#dce4eb;--ink:#1e2c39;--muted:#667788;--red:#b93838;--amber:#9b6500;--green:#18794e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:9px 12px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#e7eef4;color:var(--navy)}button.danger{background:#a93333}button.small{padding:6px 9px;font-size:12px}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--navy);color:white;padding:22px 14px;flex-shrink:0}.brand{padding:0 10px 22px;border-bottom:1px solid #ffffff2b}.brand strong{font-size:19px;display:block}.brand small{color:#d0deea}.nav{margin-top:16px;display:grid;gap:5px}.nav button{background:transparent;color:#dce8f1;text-align:left;padding:11px 12px;font-weight:500}.nav button.active,.nav button:hover{background:#ffffff20;color:#fff}.nav .navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#9eb7cb;padding:12px 12px 3px}.main{min-width:0;flex:1}.topbar{background:white;border-bottom:1px solid var(--line);padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.topbar h1{font-size:20px;margin:0}.topright{display:flex;align-items:center;gap:10px}.pill{border-radius:30px;background:#e4f5ee;color:var(--green);padding:6px 10px;font-size:12px;font-weight:700}.content{padding:24px;max-width:1500px;margin:auto}.sub{color:var(--muted);font-size:13px}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.pagehead h2{margin:0 0 4px;font-size:23px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;min-width:0}.metric-label{color:var(--muted);font-size:13px}.metric{font-size:25px;font-weight:750;margin:9px 0 5px}.metric-note{font-size:12px;color:var(--muted)}.sectiongrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:15px}.card h3{margin:0 0 14px;font-size:16px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #edf1f4}th{background:#f8fafc;color:#596a79;font-size:11px;text-transform:uppercase;letter-spacing:.4px}tr:last-child td{border-bottom:0}.status{font-size:11px;font-weight:700;border-radius:20px;padding:5px 8px;display:inline-block;background:#e9f6ef;color:#18794e}.status.warn{background:#fff3d8;color:#8c5c00}.status.bad{background:#fde8e8;color:#a62c2c}.status.info{background:#e5f0fa;color:#225e8b}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #ccd7e0;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);min-width:0;width:100%}.toolbar input{max-width:300px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field label{display:block;font-size:12px;color:#526373;margin-bottom:6px;font-weight:700}.field.full{grid-column:1/-1}.actions{display:flex;gap:6px}.empty{text-align:center;color:var(--muted);padding:28px}.notice{border:1px solid #f0d99f;background:#fff8e5;padding:12px 14px;border-radius:10px;color:#765000;font-size:13px;margin-bottom:14px}.successnotice{border-color:#b8e2cb;background:#edfaf2;color:#17633f}.alertlist{display:grid;gap:9px}.alertitem{padding:12px;border:1px solid var(--line);border-radius:9px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff}.alertitem strong{display:block;font-size:13px;margin-bottom:3px}.alertitem small{color:var(--muted)}.barrow{display:grid;grid-template-columns:105px 1fr 80px;gap:8px;align-items:center;font-size:12px;margin:12px 0}.barbg{height:9px;background:#e9eff4;border-radius:20px;overflow:hidden}.barfill{height:100%;background:var(--teal);border-radius:20px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#0d203a75;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:white;border-radius:14px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;background:#163b2c;color:white;padding:12px 16px;border-radius:10px;z-index:40;box-shadow:0 8px 30px #0002}.footerhint{font-size:12px;color:var(--muted);margin-top:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.reportbox{padding:13px;border:1px solid var(--line);border-radius:9px;margin:8px 0}.reportbox strong{display:block;font-size:20px;margin-top:5px}.mobilemenu{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:210px}.sectiongrid{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{width:100%;padding:12px}.brand{padding:5px 8px 12px}.nav{display:flex;overflow:auto;margin-top:8px}.nav .navlabel{display:none}.nav button{white-space:nowrap;padding:9px}.topbar{padding:13px 15px}.topbar h1{font-size:16px}.topright .pill{display:none}.content{padding:14px}.grid{gap:9px}.card{padding:13px}.metric{font-size:21px}.formgrid,.two{grid-template-columns:1fr}.pagehead h2{font-size:20px}}
@media print{.sidebar,.topbar,.toolbar,.pagehead button,.actions,.footerhint{display:none!important}.content{padding:0}.card,.tablewrap{break-inside:avoid}.app{display:block}body{background:white}}
</style></head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><strong>TRUSTEEN</strong><small>Drug Center · Smart Inventory</small></div><nav class="nav" id="nav">
<div class="navlabel">Workspace</div>
<button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button><button data-page="inventory">▣ &nbsp; Products & Stock</button><button data-page="sales">▤ &nbsp; Sales / POS</button><button data-page="purchases">⇧ &nbsp; Purchases & Suppliers</button><button data-page="customers">♙ &nbsp; Customers & Credit</button>
<div class="navlabel">Intelligence</div><button data-page="alerts">⚠ &nbsp; Smart Alerts</button><button data-page="reports">▥ &nbsp; Reports & Profit</button><button data-page="expenses">− &nbsp; Expenses</button><button data-page="audit">◷ &nbsp; Audit Trail</button><button data-page="settings">⚙ &nbsp; Settings & Backup</button>
</nav></aside>
<main class="main"><header class="topbar"><h1 id="topTitle">Dashboard overview</h1><div class="topright"><span class="pill" id="connection">● Demo mode</span><span class="sub" id="today"></span><button class="secondary small" onclick="window.print()">Print</button></div></header><div class="content" id="view"></div></main>
</div><div id="modalroot"></div><div id="toastroot"></div>
<script>
const KEY='trusteen_prototype_v1';
const todayISO=()=>new Date().toISOString().slice(0,10);
const daysFrom=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const money=n=>'UGX '+Math.round(Number(n)||0).toLocaleString('en-UG');
const uid=()=>Math.random().toString(36).slice(2,9).toUpperCase();
const initial={
products:[
{id:'P001',name:'Paracetamol 500mg',category:'Analgesic',barcode:'616100100001',unit:'tablet',qty:420,min:100,cost:80,price:150,supplier:'Kampala Medical Supplies',batch:'PCM2408',expiry:daysFrom(210),daily:28},
{id:'P002',name:'Amoxicillin 500mg',category:'Antibiotic',barcode:'616100100002',unit:'capsule',qty:48,min:60,cost:180,price:300,supplier:'Uganda Pharma Ltd',batch:'AMX119',expiry:daysFrom(65),daily:12},
{id:'P003',name:'ORS Sachets',category:'Rehydration',barcode:'616100100003',unit:'sachet',qty:17,min:40,cost:450,price:700,supplier:'Kampala Medical Supplies',batch:'ORS-77',expiry:daysFrom(300),daily:8},
{id:'P004',name:'Cetirizine 10mg',category:'Antihistamine',barcode:'616100100004',unit:'tablet',qty:96,min:30,cost:100,price:200,supplier:'Uganda Pharma Ltd',batch:'CET502',expiry:daysFrom(12),daily:5},
{id:'P005',name:'Vitamin C 100mg',category:'Vitamins',barcode:'616100100005',unit:'tablet',qty:230,min:50,cost:70,price:120,supplier:'HealthLink Distributors',batch:'VTC811',expiry:daysFrom(450),daily:9},
{id:'P006',name:'Cough Syrup 100ml',category:'Cough & cold',barcode:'616100100006',unit:'bottle',qty:8,min:12,cost:3200,price:4500,supplier:'HealthLink Distributors',batch:'CS009',expiry:daysFrom(95),daily:3},
{id:'P007',name:'Disposable gloves',category:'Medical supplies',barcode:'616100100007',unit:'pair',qty:155,min:40,cost:250,price:400,supplier:'Kampala Medical Supplies',batch:'GLV42',expiry:daysFrom(900),daily:6}
],
customers:[{id:'C001',name:'Grace A.',phone:'0700 000 111',balance:18000,notes:'Regular customer'},{id:'C002',name:'Peter O.',phone:'0770 000 222',balance:0,notes:''}],
suppliers:[{id:'S001',name:'Kampala Medical Supplies',phone:'0701 111 222',email:'orders@example.test',balance:0},{id:'S002',name:'Uganda Pharma Ltd',phone:'0755 111 333',email:'sales@example.test',balance:125000},{id:'S003',name:'HealthLink Distributors',phone:'0780 222 333',email:'hello@example.test',balance:0}],
sales:[{id:'INV-1001',date:todayISO(),customer:'Walk-in customer',payment:'Cash',total:46500,cost:30200,items:[{product:'Paracetamol 500mg',qty:100,price:150,cost:80},{product:'Vitamin C 100mg',qty:10,price:120,cost:70}],status:'Completed',user:'Admin'},{id:'INV-1002',date:todayISO(),customer:'Grace A.',payment:'Credit',total:18000,cost:10800,items:[{product:'Amoxicillin 500mg',qty:60,price:300,cost:180}],status:'Completed',user:'Admin'}],
purchases:[],expenses:[{id:'EX001',date:todayISO(),category:'Transport',description:'Stock delivery',amount:15000}],
movements:[],audit:[{date:new Date().toISOString(),user:'Admin',action:'Prototype initialized',detail:'Demo data loaded'}],
settings:{shop:'Trusteen Drug Center',lowDays:7,expiryDays:30,owner:'Shop Owner',currency:'UGX'}
};
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=JSON.parse(JSON.stringify(initial))}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function log(action,detail){db.audit.unshift({date:new Date().toISOString(),user:db.settings.owner||'Admin',action,detail});db.audit=db.audit.slice(0,500);save()}
function toast(msg){let r=document.getElementById('toastroot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>r.innerHTML='',2800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(p){current=p;document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
let current='dashboard', searchText='', saleCart=[];
document.getElementById('today').textContent=new Date().toLocaleDateString('en-UG',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function metrics(){let today=todayISO(), ss=db.sales.filter(s=>s.date===today&&s.status!=='Voided'),rev=ss.reduce((a,s)=>a+s.total,0),gross=ss.reduce((a,s)=>a+(s.total-s.cost),0),stock=db.products.reduce((a,p)=>a+p.qty,0),alerts=db.products.filter(p=>p.qty<=p.min||p.expiry<=daysFrom(db.settings.expiryDays)||p.qty<=p.daily*db.settings.lowDays).length;return{rev,gross,stock,alerts,ss}}
function status(text,type=''){return `<span class="status ${type}">${esc(text)}</span>`}
function metric(label,val,note,icon=''){return `<div class="card"><div class="metric-label">${icon} ${label}</div><div class="metric">${val}</div><div class="metric-note">${note}</div></div>`}
function pageHead(title,desc,button=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="sub">${desc}</div></div>${button}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No records found.</td></tr>`}</tbody></table></div>`}
function render(){let title={dashboard:'Dashboard overview',inventory:'Products & stock',sales:'Sales & point of sale',purchases:'Purchases & suppliers',customers:'Customers & credit accounts',alerts:'Smart alerts & predictions',reports:'Reports & profitability',expenses:'Operating expenses',audit:'Audit trail',settings:'Settings & data protection'}[current];document.getElementById('topTitle').textContent=title;document.getElementById('view').innerHTML=({dashboard:dashboardPage,inventory:inventoryPage,sales:salesPage,purchases:purchasesPage,customers:customersPage,alerts:alertsPage,reports:reportsPage,expenses:expensesPage,audit:auditPage,settings:settingsPage}[current])()}
function dashboardPage(){let m=metrics(),low=db.products.filter(p=>p.qty<=p.min),exp=db.products.filter(p=>p.expiry<=daysFrom(db.settings.expiryDays));let top=[...db.products].sort((a,b)=>b.daily-a.daily).slice(0,5);return `${pageHead('Good day, '+esc(db.settings.owner)+' 👋','Here is the current picture of your drugshop.','<button onclick="openSale()">＋ New sale</button>')}<div class="notice">Prototype mode: this is sample data saved in this browser only. Do not use it as the live business database until a secure backend and backups are configured.</div><div class="grid">${metric("Today's sales",money(m.rev),m.ss.length+' completed transactions','↗')}${metric("Today's gross profit",money(m.gross),'Before operating expenses','▥')}${metric('Units in stock',m.stock,'Across '+db.products.length+' products','▣')}${metric('Items needing attention',m.alerts,'Stock / expiry / reorder alerts','⚠')}</div><div class="sectiongrid"><div class="card"><h3>Priority alerts</h3><div class="alertlist">${alertItems().slice(0,5).join('')||'<div class="empty">No alerts right now.</div>'}<button class="secondary" onclick="setPage('alerts')">View all alerts →</button></div></div><div class="card"><h3>Fast-moving products</h3>${top.map(p=>`<div class="barrow"><span>${esc(p.name)}</span><div class="barbg"><div class="barfill" style="width:${Math.min(100,p.daily/Math.max(...top.map(x=>x.daily))*100)}%"></div></div><strong>${p.daily}/day</strong></div>`).join('')}<div class="footerhint">Forecast uses demo average daily demand; real predictions need historical sales data.</div></div></div><div class="card" style="margin-top:15px"><h3>Recent transactions</h3>${table(['Receipt','Date','Customer','Payment','Total','Status'],db.sales.slice(0,5).map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.date)}</td><td>${esc(s.customer)}</td><td>${esc(s.payment)}</td><td>${money(s.total)}</td><td>${status(s.status,s.status==='Voided'?'bad':'')}</td></tr>`))}</div>`}
function inventoryPage(){return `${pageHead('Products & stock','Manage quantities, batches, prices, expiry dates and reorder levels.','<button onclick="productModal()">＋ Add product</button>')}<div class="toolbar"><input placeholder="Search name, barcode, category…" value="${esc(searchText)}" oninput="searchText=this.value;render()"><select onchange="filterCategory=this.value;render()"><option value="">All categories</option>${[...new Set(db.products.map(p=>p.category))].map(c=>`<option ${window.filterCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="secondary" onclick="exportCSV('products')">Export CSV</button></div>${table(['Product','Barcode','Category','Qty','Unit','Cost','Selling price','Expiry','Status','Actions'],db.products.filter(p=>(!searchText||[p.name,p.barcode,p.category].join(' ').toLowerCase().includes(searchText.toLowerCase()))&&(!window.filterCategory||p.category===window.filterCategory)).map(p=>`<tr><td><strong>${esc(p.name)}</strong><div class="sub">${esc(p.batch||'No batch')}</div></td><td>${esc(p.barcode||'—')}</td><td>${esc(p.category)}</td><td><strong>${p.qty}</strong></td><td>${esc(p.unit)}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${esc(p.expiry||'—')}</td><td>${p.expiry<todayISO()?status('Expired','bad'):p.qty<=p.min?status('Low stock','warn'):p.expiry<=daysFrom(db.settings.expiryDays)?status('Near expiry','warn'):status('In stock')}</td><td><div class="actions"><button class="small secondary" onclick="productModal('${p.id}')">Edit</button><button class="small" onclick="adjustStock('${p.id}')">Adjust</button></div></td></tr>`))}<div class="footerhint">Batch-level expiry and costing are represented in this prototype with one primary batch per product. A production version should support multiple batches per product and FEFO allocation.</div>`}
function salesPage(){return `${pageHead('Sales & point of sale','Create a sale, record payment, print a receipt and update stock automatically.','<button onclick="openSale()">＋ New sale</button>')}<div class="grid" style="margin-bottom:15px">${metric('All-time sales',money(db.sales.filter(s=>s.status!=='Voided').reduce((a,s)=>a+s.total,0)),'Completed sales')}${metric('Transactions',db.sales.length,'Including voided records')}${metric('Credit sales',money(db.sales.filter(s=>s.payment==='Credit'&&s.status!=='Voided').reduce((a,s)=>a+s.total,0)),'Credit sales recorded')}${metric('Returns / voids',db.sales.filter(s=>s.status==='Voided').length,'Audit trail retained')}</div><div class="toolbar"><input placeholder="Search receipt or customer…" value="${esc(searchText)}" oninput="searchText=this.value;render()"><button class="secondary" onclick="exportCSV('sales')">Export CSV</button></div>${table(['Receipt','Date','Customer','Payment','Items','Total','Gross profit','Status','Action'],db.sales.filter(s=>(!searchText||(s.id+' '+s.customer).toLowerCase().includes(searchText.toLowerCase()))).map(s=>`<tr><td><strong>${esc(s.id)}</strong></td><td>${esc(s.date)}</td><td>${esc(s.customer)}</td><td>${esc(s.payment)}</td><td>${s.items.length}</td><td>${money(s.total)}</td><td>${money(s.total-s.cost)}</td><td>${status(s.status,s.status==='Voided'?'bad':'')}</td><td>${s.status!=='Voided'?`<button class="small danger" onclick="voidSale('${s.id}')">Void</button>`:'—'}</td></tr>`))}<div class="footerhint">Payment provider integrations are not connected; mobile money is recorded as a payment method only.</div>`}
function purchasesPage(){return `${pageHead('Purchases & suppliers','Record stock deliveries, supplier balances and purchase orders.','<button onclick="purchaseModal()">＋ Receive stock</button>')}<div class="two"><div class="card"><h3>Suppliers (${db.suppliers.length})</h3><button class="secondary small" onclick="supplierModal()">＋ Add supplier</button><div style="margin-top:12px">${table(['Supplier','Phone','Outstanding'],db.suppliers.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${money(s.balance||0)}</td></tr>`))}</div></div><div class="card"><h3>Purchase summary</h3><div class="reportbox">Total purchase records<strong>${db.purchases.length}</strong></div><div class="reportbox">Recorded purchases<strong>${money(db.purchases.reduce((a,p)=>a+p.total,0))}</strong></div><div class="reportbox">Supplier balances<strong>${money(db.suppliers.reduce((a,s)=>a+(+s.balance||0),0))}</strong></div></div></div><div style="margin-top:15px"><h3>Recent purchases</h3>${table(['Reference','Date','Supplier','Product','Quantity','Total'],db.purchases.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.date)}</td><td>${esc(p.supplier)}</td><td>${esc(p.product)}</td><td>${p.qty}</td><td>${money(p.total)}</td></tr>`))}</div>`}
function customersPage(){return `${pageHead('Customers & credit accounts','Manage customer records, credit sales, repayments and outstanding balances.','<button onclick="customerModal()">＋ Add customer</button>')}<div class="grid" style="margin-bottom:15px">${metric('Customers',db.customers.length,'Saved customer accounts')}${metric('Outstanding credit',money(db.customers.reduce((a,c)=>a+(+c.balance||0),0)),'Recorded customer balances')}${metric('Customers owing',db.customers.filter(c=>c.balance>0).length,'Follow-up may be required')}${metric('Payments recorded',db.sales.filter(s=>s.payment!=='Credit').length,'Non-credit transactions')}</div>${table(['Customer','Phone','Outstanding balance','Notes','Actions'],db.customers.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone||'—')}</td><td>${money(c.balance||0)}</td><td>${esc(c.notes||'—')}</td><td><div class="actions"><button class="small" onclick="repay('${c.id}')">Record payment</button><button class="small secondary" onclick="customerModal('${c.id}')">Edit</button></div></td></tr>`))}<div class="footerhint">Only collect customer details that are necessary. Add consent and privacy notices before production use.</div>`}
function alertItems(){let a=[];db.products.forEach(p=>{if(p.qty<=0)a.push({type:'bad',title:'Out of stock: '+p.name,detail:'Reorder immediately; current quantity is zero.'});else if(p.qty<=p.min)a.push({type:'warn',title:'Low stock: '+p.name,detail:`${p.qty} ${p.unit}(s) left; minimum level is ${p.min}.`});if(p.expiry<todayISO())a.push({type:'bad',title:'Expired batch: '+p.name,detail:`Batch ${p.batch||'unknown'} expired on ${p.expiry}. Quarantine and do not sell.`});else if(p.expiry<=daysFrom(db.settings.expiryDays))a.push({type:'warn',title:'Expiry approaching: '+p.name,detail:`Batch ${p.batch||'unknown'} expires ${p.expiry}. Apply FEFO and review stock.`});let days=p.daily>0?p.qty/p.daily:999;if(days<=db.settings.lowDays&&p.qty>p.min)a.push({type:'info',title:'Reorder forecast: '+p.name,detail:`At about ${p.daily} units/day, current stock covers ${days.toFixed(1)} days.`})});db.customers.filter(c=>c.balance>0).forEach(c=>a.push({type:'info',title:'Credit balance: '+c.name,detail:`Outstanding ${money(c.balance)}. Review account and follow up.`}));return a}
function alertsPage(){let a=alertItems();return `${pageHead('Smart alerts & predictions','Actionable warnings for stock, expiry, demand and customer credit.','<button class="secondary" onclick="window.print()">Print alerts</button>')}<div class="notice">Smart forecasting in this prototype uses sample average daily demand. A production model should learn from dated sales history, lead times, seasonality and supplier delivery reliability.</div><div class="grid" style="margin-bottom:15px">${metric('Open alerts',a.length,'All alert categories')}${metric('Low / out of stock',db.products.filter(p=>p.qty<=p.min).length,'Review reorder list')}${metric('Expiry within '+db.settings.expiryDays+' days',db.products.filter(p=>p.expiry<=daysFrom(db.settings.expiryDays)).length,'Review batch by batch')}${metric('Credit accounts owing',db.customers.filter(c=>c.balance>0).length,'Customer account follow-up')}</div><div class="alertlist">${a.map(x=>`<div class="alertitem"><div><strong>${esc(x.title)}</strong><small>${esc(x.detail)}</small></div>${status(x.type==='bad'?'Urgent':x.type==='warn'?'Warning':'Suggestion',x.type)}</div>`).join('')||'<div class="card empty">No alerts at this time.</div>'}</div><div class="card" style="margin-top:15px"><h3>Reorder suggestions</h3>${table(['Product','Available','Daily demand','Days of cover','Suggested reorder'],db.products.map(p=>({p,cover:p.daily?p.qty/p.daily:999,reorder:Math.max(0,Math.ceil(p.daily*14-p.qty))})).filter(x=>x.reorder>0).map(x=>`<tr><td>${esc(x.p.name)}</td><td>${x.p.qty}</td><td>${x.p.daily}</td><td>${x.cover.toFixed(1)}</td><td><strong>${x.reorder} ${esc(x.p.unit)}s</strong></td></tr>`))}<div class="footerhint">Suggested quantity targets 14 days of demand; adjust for supplier lead time, expiry, minimum order quantity and budget before ordering.</div></div>`}
function reportsPage(){let m=metrics(),gross=db.sales.filter(s=>s.status!=='Voided').reduce((a,s)=>a+s.total-s.cost,0),expenses=db.expenses.reduce((a,e)=>a+e.amount,0),todaySales=db.sales.filter(s=>s.date===todayISO()&&s.status!=='Voided'),todayGross=todaySales.reduce((a,s)=>a+s.total-s.cost,0),todayExpenses=db.expenses.filter(e=>e.date===todayISO()).reduce((a,e)=>a+e.amount,0);let stockValue=db.products.reduce((a,p)=>a+p.qty*p.cost,0);return `${pageHead('Reports & profitability','Business performance, product margin, stock valuation and downloadable records.','<button class="secondary" onclick="exportCSV(\\'sales\\')">Export sales CSV</button>')}<div class="grid">${metric('Today revenue',money(m.rev),'Completed sales')}${metric('Today gross profit',money(todayGross),'Revenue less sold-goods cost')}${metric('Today recorded expenses',money(todayExpenses),'Expenses entered today')}${metric('Estimated today net',money(todayGross-todayExpenses),'Gross profit less recorded expenses')}</div><div class="sectiongrid"><div class="card"><h3>Sales by payment method (all time)</h3>${['Cash','Mobile Money','Card','Credit','Bank transfer'].map(method=>{let n=db.sales.filter(s=>s.payment===method&&s.status!=='Voided').reduce((a,s)=>a+s.total,0);return `<div class="barrow"><span>${method}</span><div class="barbg"><div class="barfill" style="width:${Math.min(100,n/Math.max(1,...['Cash','Mobile Money','Card','Credit','Bank transfer'].map(x=>db.sales.filter(s=>s.payment===x&&s.status!=='Voided').reduce((a,s)=>a+s.total,0)))*100)}%"></div></div><strong>${money(n)}</strong></div>`}).join('')}</div><div class="card"><h3>Business snapshot</h3><div class="reportbox">Current stock at recorded cost<strong>${money(stockValue)}</strong></div><div class="reportbox">All-time gross profit<strong>${money(gross)}</strong></div><div class="reportbox">All-time recorded expenses<strong>${money(expenses)}</strong></div><div class="reportbox">All-time estimated net contribution<strong>${money(gross-expenses)}</strong></div></div></div><div class="card" style="margin-top:15px"><h3>Product profitability (recorded sales)</h3>${table(['Product','Units sold','Revenue','Estimated cost','Gross profit'],db.products.map(p=>{let items=db.sales.filter(s=>s.status!=='Voided').flatMap(s=>s.items).filter(i=>i.product===p.name),qty=items.reduce((a,i)=>a+i.qty,0),rev=items.reduce((a,i)=>a+i.qty*i.price,0),cost=items.reduce((a,i)=>a+i.qty*i.cost,0);return `<tr><td>${esc(p.name)}</td><td>${qty}</td><td>${money(rev)}</td><td>${money(cost)}</td><td>${money(rev-cost)}</td></tr>`}))}</div><div class="footerhint">Prototype reports summarize transactions currently stored in this browser; demo data may not represent the real business. For formal accounting, reconcile cash, mobile-money statements, returns, tax and expenses.</div>`}
function expensesPage(){return `${pageHead('Operating expenses','Record costs that help calculate estimated net profit.','<button onclick="expenseModal()">＋ Add expense</button>')}<div class="grid" style="margin-bottom:15px">${metric('Total recorded expenses',money(db.expenses.reduce((a,e)=>a+e.amount,0)),'All dates')}${metric('Expenses today',money(db.expenses.filter(e=>e.date===todayISO()).reduce((a,e)=>a+e.amount,0)),'Recorded today')}</div>${table(['Date','Category','Description','Amount','Action'],db.expenses.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td><button class="small danger" onclick="deleteExpense('${e.id}')">Delete</button></td></tr>`))}`}
function auditPage(){return `${pageHead('Audit trail','Recent actions recorded in this browser prototype.','<button class="secondary" onclick="exportCSV(\\'audit\\')">Export CSV</button>')}<div class="notice">Audit records improve accountability but browser-only storage can be edited or deleted by someone with device access. Production audit logs must be server-side, access-controlled and tamper-resistant.</div>${table(['Time','User','Action','Details'],db.audit.map(a=>`<tr><td>${esc(new Date(a.date).toLocaleString())}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`))}`}
function settingsPage(){return `${pageHead('Settings & data protection','Set shop details, alert thresholds and manage demo data.')}<div class="two"><div class="card"><h3>Shop settings</h3><form onsubmit="saveSettings(event)" class="formgrid"><div class="field full"><label>Business name</label><input name="shop" value="${esc(db.settings.shop)}" required></div><div class="field"><label>Owner / active user</label><input name="owner" value="${esc(db.settings.owner)}" required></div><div class="field"><label>Currency</label><select name="currency"><option>UGX</option></select></div><div class="field"><label>Expiry alert window (days)</label><input name="expiryDays" type="number" min="1" value="${db.settings.expiryDays}"></div><div class="field"><label>Reorder coverage target (days)</label><input name="lowDays" type="number" min="1" value="${db.settings.lowDays}"></div><div class="field full"><button>Save settings</button></div></form></div><div class="card"><h3>Data management</h3><p class="sub">This prototype stores demo records in the current browser's local storage. It is not yet a secure multi-user online application.</p><div class="toolbar"><button onclick="exportCSV('all')">Export all key records</button><button class="secondary" onclick="downloadBackup()">Download JSON backup</button></div><div class="notice">Keep downloaded backups secure because they may contain customer balances and business information.</div><button class="danger" onclick="resetDemo()">Reset to demo data</button><div class="footerhint">Before production: use a Django backend, PostgreSQL, user roles, HTTPS, tested backups, server-side audit logging and secure deployment settings.</div></div></div><div class="card" style="margin-top:15px"><h3>Planned integrations (not connected)</h3><div class="alertlist">${[['SMS / email alerts','Needs provider credentials and message consent'],['Mobile money','Payment recording is demo-only; real collection requires a supported provider integration'],['Barcode scanner','USB/Bluetooth keyboard-style scanners can work with a production POS input'],['Offline synchronization','Requires conflict-safe local queue and server reconciliation'],['AI demand forecasting','Needs clean historical sales, lead times and forecast evaluation']].map(x=>`<div class="alertitem"><div><strong>${x[0]}</strong><small>${x[1]}</small></div>${status('Not connected','info')}</div>`).join('')}</div></div>`}
function modal(title,body,onSave,saveLabel='Save'){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="secondary small" onclick="closeModal()">✕</button></div><form id="modalform"><div class="formgrid">${body}</div><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>${saveLabel}</button></div></form></div></div>`;document.getElementById('modalform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());onSave(data);closeModal();save();render()}}
function field(label,name,value='',type='text',opts=null,required=true){let input=opts?`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option ${String(value)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'step="any"':''}>`;return `<div class="field"><label>${label}</label>${input}</div>`}
function productModal(id){let p=db.products.find(x=>x.id===id)||{name:'',category:'General',barcode:'',unit:'pack',qty:0,min:10,cost:0,price:0,supplier:db.suppliers[0]?.name||'',batch:'',expiry:daysFrom(365),daily:1};modal(id?'Edit product':'Add product',field('Product name','name',p.name)+field('Category','category',p.category)+field('Barcode / SKU','barcode',p.barcode,false)+field('Unit','unit',p.unit)+field('Quantity on hand','qty',p.qty,'number')+field('Minimum stock','min',p.min,'number')+field('Buying cost per unit (UGX)','cost',p.cost,'number')+field('Selling price per unit (UGX)','price',p.price,'number')+field('Supplier','supplier',p.supplier,'text',db.suppliers.map(s=>s.name).concat(p.supplier&&!db.suppliers.some(s=>s.name===p.supplier)?[p.supplier]:[]),false)+field('Batch / lot number','batch',p.batch,false)+field('Expiry date','expiry',p.expiry,'date',null,false)+field('Estimated daily demand','daily',p.daily,'number'),d=>{let item={...p,...d,qty:+d.qty,min:+d.min,cost:+d.cost,price:+d.price,daily:+d.daily,id:p.id||'P'+uid()};if(id){db.products=db.products.map(x=>x.id===id?item:x);log('Product edited',item.name)}else{db.products.push(item);log('Product added',item.name)}toast('Product saved')})}
function adjustStock(id){let p=db.products.find(x=>x.id===id);modal('Adjust stock — '+esc(p.name),field('Adjustment type','type','Received','text',['Received','Damaged','Expired','Count correction','Return'])+field('Quantity (+/- for count correction)','qty',1,'number')+field('Reason','reason','Stock count / delivery'),d=>{let q=+d.qty;if(d.type==='Received'||d.type==='Return')p.qty+=Math.abs(q);else if(d.type==='Damaged'||d.type==='Expired')p.qty=Math.max(0,p.qty-Math.abs(q));else p.qty=Math.max(0,p.qty+q);db.movements.unshift({date:new Date().toISOString(),product:p.name,type:d.type,qty:q,reason:d.reason});log('Stock adjusted',p.name+' · '+d.type+' · '+q+' · '+d.reason);toast('Stock adjusted')})}
function openSale(){saleCart=[];let products=db.products.filter(p=>p.qty>0);modal('New sale / POS',`<div class="field full"><label>Product</label><select id="saleProduct">${products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (${p.qty} available)</option>`).join('')}</select></div>${field('Quantity','qty',1,'number')}${field('Customer','customer','Walk-in customer','text',['Walk-in customer',...db.customers.map(c=>c.name)])}${field('Payment method','payment','Cash','text',['Cash','Mobile Money','Card','Credit','Bank transfer'])}${field('Discount (UGX)','discount',0,'number')}`,d=>{let id=document.getElementById('saleProduct')?.value;let p=db.products.find(x=>x.id===id),qty=+d.qty,discount=+d.discount;if(!p||qty<1||qty>p.qty){toast('Invalid quantity or insufficient stock');return}let total=Math.max(0,p.price*qty-discount),cost=p.cost*qty;if(d.payment==='Credit'&&d.customer==='Walk-in customer'){toast('Choose a named customer for a credit sale');return}p.qty-=qty;let s={id:'INV-'+Date.now().toString().slice(-7),date:todayISO(),customer:d.customer,payment:d.payment,total,cost,items:[{product:p.name,qty,price:p.price,cost:p.cost}],status:'Completed',user:db.settings.owner};db.sales.unshift(s);if(d.payment==='Credit'){let c=db.customers.find(x=>x.name===d.customer);if(c)c.balance=(+c.balance||0)+total}db.movements.unshift({date:new Date().toISOString(),product:p.name,type:'Sale',qty:-qty,reason:s.id});log('Sale completed',s.id+' · '+p.name+' × '+qty+' · '+money(total));toast('Sale recorded; stock updated')},'Complete sale')}
function voidSale(id){let s=db.sales.find(x=>x.id===id);if(!s||!confirm('Void this sale? A production system should require manager approval and a reason.'))return;s.status='Voided';s.items.forEach(i=>{let p=db.products.find(p=>p.name===i.product);if(p)p.qty+=i.qty});if(s.payment==='Credit'){let c=db.customers.find(c=>c.name===s.customer);if(c)c.balance=Math.max(0,c.balance-s.total)}log('Sale voided',id+'; stock restored in prototype');save();render();toast('Sale voided and stock restored')}
function customerModal(id){let c=db.customers.find(x=>x.id===id)||{name:'',phone:'',balance:0,notes:''};modal(id?'Edit customer':'Add customer',field('Customer name','name',c.name)+field('Phone','phone',c.phone,'text',null,false)+field('Opening balance (UGX)','balance',c.balance,'number')+`<div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes||'')}</textarea></div>`,d=>{let item={...c,...d,balance:+d.balance,id:c.id||'C'+uid()};if(id)db.customers=db.customers.map(x=>x.id===id?item:x);else db.customers.push(item);log(id?'Customer edited':'Customer added',item.name);toast('Customer saved')})}
function repay(id){let c=db.customers.find(x=>x.id===id);modal('Record customer payment — '+esc(c.name),field('Amount received (UGX)','amount',Math.max(0,c.balance),'number')+field('Method','method','Cash','text',['Cash','Mobile Money','Bank transfer'])+field('Reference','reference','','text',null,false),d=>{let a=+d.amount;if(a<=0||a>c.balance){toast('Enter a valid amount not greater than balance');return}c.balance-=a;log('Customer repayment',c.name+' paid '+money(a)+' by '+d.method+' '+d.reference);toast('Payment recorded')})}
function supplierModal(){modal('Add supplier',field('Supplier name','name')+field('Phone','phone')+field('Email','email','','email',null,false)+field('Opening balance (UGX)','balance',0,'number'),d=>{db.suppliers.push({...d,balance:+d.balance,id:'S'+uid()});log('Supplier added',d.name);toast('Supplier saved')})}
function purchaseModal(){modal('Receive stock',field('Product','product',db.products[0]?.name,'text',db.products.map(p=>p.name))+field('Supplier','supplier',db.suppliers[0]?.name,'text',db.suppliers.map(s=>s.name))+field('Quantity received','qty',1,'number')+field('Cost per unit (UGX)','cost',0,'number')+field('Batch number','batch','NEW-'+uid())+field('Expiry date','expiry',daysFrom(365),'date')+field('Supplier invoice reference','ref','','text',null,false),d=>{let p=db.products.find(x=>x.name===d.product),q=+d.qty,cost=+d.cost;if(!p||q<=0||cost<0){toast('Check product, quantity and cost');return}p.qty+=q;p.cost=cost;p.batch=d.batch;p.expiry=d.expiry;p.supplier=d.supplier;let total=q*cost;db.purchases.unshift({id:'PO-'+uid(),date:todayISO(),supplier:d.supplier,product:p.name,qty:q,cost,total,batch:d.batch,expiry:d.expiry,ref:d.ref});log('Stock received',p.name+' × '+q+' from '+d.supplier+'; '+money(total));toast('Stock received')},'Receive stock')}
function expenseModal(){modal('Add expense',field('Date','date',todayISO(),'date')+field('Category','category','Transport','text',['Rent','Transport','Utilities','Wages','Packaging','Bank charges','Other'])+field('Amount (UGX)','amount',0,'number')+field('Description','description'),d=>{db.expenses.unshift({...d,amount:+d.amount,id:'EX'+uid()});log('Expense added',d.category+' '+money(d.amount));toast('Expense saved')})}
function deleteExpense(id){if(!confirm('Delete this expense record?'))return;db.expenses=db.expenses.filter(e=>e.id!==id);log('Expense deleted',id);save();render()}
function saveSettings(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());db.settings={...db.settings,...d,expiryDays:+d.expiryDays,lowDays:+d.lowDays};log('Settings updated','Shop settings saved');save();render();toast('Settings saved')}
function downloadBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trusteen-demo-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href);log('Backup downloaded','JSON backup exported');toast('Backup download started')}
function exportCSV(type){let data,filename;if(type==='products'||type==='all'){data=[['Products'],['id','name','category','barcode','qty','unit','cost','price','batch','expiry'],...db.products.map(p=>[p.id,p.name,p.category,p.barcode,p.qty,p.unit,p.cost,p.price,p.batch,p.expiry])];filename='trusteen-products.csv'}else if(type==='sales'){data=[['id','date','customer','payment','total','cost','profit','status'],...db.sales.map(s=>[s.id,s.date,s.customer,s.payment,s.total,s.cost,s.total-s.cost,s.status])];filename='trusteen-sales.csv'}else{data=[['date','user','action','detail'],...db.audit.map(a=>[a.date,a.user,a.action,a.detail])];filename='trusteen-audit.csv'}let csv=data.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=filename;a.click();URL.revokeObjectURL(a.href);toast('CSV export started')}
function resetDemo(){if(!confirm('Reset all browser data to the original sample data? This deletes changes made in this prototype.'))return;db=JSON.parse(JSON.stringify(initial));save();log('Demo reset','Reset to sample data');render();toast('Demo data restored')}
render();
</script></body></html>
